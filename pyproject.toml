[project]
name = "retail_pos_india"
authors = [{ name = "Sudhanshu Shekhar" }]
description = "Point of Sale tweaks for ERPNext: whole-amount number pad, safe card and UPI details, wider cart"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
erpnext = ">=16.0.0,<17.0.0"
